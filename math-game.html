<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小騎士數學冒險</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* 版面：上方是俯視角的隨機地圖（畫布 + 小地圖），下方是方向鍵，遇到村民或野獸時換成題目卡 */
    :root {
      --paper: #fffaf0;
      --ink: #3a2e22;
      --muted: #8a7a66;
      --accent: #e8743b;
      --accent-dark: #c65a24;
      --blue: #3d8fd6;
      --blue-dark: #2c72b2;
      --green: #2fa85c;
      --green-dark: #23854a;
      --grass-dark: #5fa83a;
      --red: #e0485a;
      --red-dark: #b8303f;
      --gold: #f5b82e;
      --line: #eadcc2;
      --shadow: 0 5px 0 rgba(58, 46, 34, 0.14);
      color-scheme: light;
    }

    html, body { min-height: 100%; }

    body {
      font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Heiti TC", sans-serif;
      background: linear-gradient(180deg, #cfeeff 0%, #f3fbe9 50%, #fff6dc 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding-block: 14px 24px;
      padding-left: max(16px, env(safe-area-inset-left, 0px));
      padding-right: max(16px, env(safe-area-inset-right, 0px));
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] { display: none !important; }

    .app { width: 100%; max-width: 560px; }

    .screen { display: none; flex-direction: column; gap: 12px; animation: pop .3s ease; }
    .screen.active { display: flex; }
    @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }

    .card { background: var(--paper); border: 3px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); }
    .card h2 { font-size: 1.05rem; margin-bottom: 10px; }

    /* ---------- 開始畫面 ---------- */
    .hero { text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }
    .hero-art { display: flex; align-items: flex-end; gap: 14px; font-size: 2.8rem; }
    .hero-art img { width: 60px; height: 70px; }
    .hero h1 { font-size: 2rem; text-wrap: balance; }
    .hero p { color: var(--muted); line-height: 1.6; text-wrap: balance; }

    .options { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .options.two { grid-template-columns: repeat(2, 1fr); }
    .opt {
      border: 3px solid var(--line); background: #fff; border-radius: 14px; padding: 10px 4px;
      font-size: 1rem; font-weight: bold; color: var(--ink); cursor: pointer; font-family: inherit; transition: transform .1s;
    }
    .opt small { display: block; font-size: .75rem; color: var(--muted); font-weight: normal; margin-top: 2px; }
    .opt .big { font-size: 1.4rem; display: block; }
    .opt.selected { border-color: var(--accent); background: #fff0e4; }
    .opt:active { transform: scale(.95); }
    .opt:focus-visible, .btn:focus-visible, .key:focus-visible, .icon-btn:focus-visible, .pad:focus-visible, .tool:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

    .name-row input {
      width: 100%; font: inherit; font-size: 1.2rem; font-weight: bold; color: var(--ink);
      border: 3px solid var(--line); border-radius: 14px; padding: 10px 12px; background: #fff;
    }
    .name-row input:focus { outline: none; border-color: var(--accent); }

    .btn {
      border: none; border-radius: 18px; padding: 15px; font-size: 1.3rem; font-weight: bold; font-family: inherit;
      color: #fff; background: var(--accent); box-shadow: 0 6px 0 var(--accent-dark); cursor: pointer;
      transition: transform .1s, box-shadow .1s;
    }
    .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--accent-dark); }
    .btn.secondary { background: var(--blue); box-shadow: 0 6px 0 var(--blue-dark); }
    .btn.secondary:active { box-shadow: 0 2px 0 var(--blue-dark); }
    .btn.go { background: var(--green); box-shadow: 0 6px 0 var(--green-dark); width: 100%; }
    .btn.go:active { box-shadow: 0 2px 0 var(--green-dark); }
    .btn.fight { background: var(--red); box-shadow: 0 6px 0 var(--red-dark); width: 100%; }
    .btn.fight:active { box-shadow: 0 2px 0 var(--red-dark); }

    .best { text-align: center; color: var(--muted); font-size: .95rem; }

    /* ---------- 冒險畫面（全螢幕，地圖在最底層，其他東西疊在上面） ---------- */
    body.playing { overflow: hidden; }
    #game-screen.active { position: fixed; inset: 0; z-index: 10; display: block; animation: none; background: #5fa83a; }
    .stage { position: absolute; inset: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
    .stage canvas#view { display: block; width: 100%; height: 100%; }

    .hud {
      position: absolute; z-index: 4; top: calc(10px + env(safe-area-inset-top, 0px));
      left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      display: flex; align-items: center; gap: 8px; pointer-events: none;
    }
    .hud > * { pointer-events: auto; }
    .hud .spacer { flex: 1; pointer-events: none; }
    .icon-btn {
      border: 3px solid var(--line); background: var(--paper); border-radius: 14px; width: 44px; height: 44px;
      font-size: 1.2rem; box-shadow: var(--shadow); cursor: pointer; flex: none; color: var(--ink); font-family: inherit;
    }
    .pill {
      background: rgba(255,250,240,.95); border: 3px solid var(--line); border-radius: 14px; padding: 6px 10px; font-weight: bold;
      box-shadow: var(--shadow); white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .pill.hearts { letter-spacing: 1px; font-size: .95rem; }
    .pill.bump { animation: bump .5s; }
    @keyframes bump { 40% { transform: scale(1.2); } }

    .under-hud {
      position: absolute; z-index: 3; top: calc(66px + env(safe-area-inset-top, 0px));
      left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; pointer-events: none;
    }
    .goals {
      background: rgba(255,250,240,.93); border-radius: 12px; padding: 4px 10px; font-size: .88rem; font-weight: bold;
      line-height: 1.5; box-shadow: 0 2px 6px rgba(0,0,0,.15); white-space: nowrap;
    }
    .map-box { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .minimap {
      width: 132px; border-radius: 10px; border: 3px solid rgba(255,255,255,.95);
      box-shadow: 0 2px 8px rgba(0,0,0,.3); image-rendering: pixelated; background: #2e3b2a; display: block;
    }
    .legend {
      display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 8px; font-size: .75rem; font-weight: bold;
      background: rgba(255,250,240,.9); border-radius: 8px; padding: 2px 6px; max-width: 132px;
    }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 2px; vertical-align: -1px; border: 1px solid rgba(0,0,0,.3); }
    .toast {
      position: absolute; z-index: 6; left: 50%; top: 32%; transform: translateX(-50%); max-width: calc(100% - 32px);
      background: rgba(58,46,34,.9); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: bold; font-size: 1rem;
      text-align: center; pointer-events: none; animation: pop .25s ease; box-shadow: 0 4px 12px rgba(0,0,0,.2);
    }

    /* 方向鍵（左下角）和說明（右下角） */
    .controls {
      position: absolute; z-index: 3; bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
      display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; pointer-events: none;
    }
    .controls > * { pointer-events: auto; }
    .dpad { display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px); gap: 4px; flex: none; }
    .pad {
      border: 3px solid rgba(234,220,194,.95); background: rgba(255,255,255,.85); border-radius: 16px; font-size: 1.6rem; color: var(--ink);
      box-shadow: var(--shadow); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; font-family: inherit;
    }
    .pad.held { transform: translateY(3px); box-shadow: 0 1px 0 rgba(58,46,34,.14); background: #fff0e4; border-color: var(--accent); }
    .pad[data-dir="up"] { grid-column: 2; grid-row: 1; }
    .pad[data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad[data-dir="right"] { grid-column: 3; grid-row: 2; }
    .pad[data-dir="down"] { grid-column: 2; grid-row: 3; }
    .dpad .hub { grid-column: 2; grid-row: 2; border-radius: 50%; background: rgba(255,255,255,.5); margin: 14px; }
    .guide {
      max-width: 280px; min-width: 0; background: rgba(255,250,240,.93); border-radius: 16px; padding: 10px 12px;
      font-size: .88rem; color: var(--muted); line-height: 1.55; box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .guide b { color: var(--ink); font-size: .98rem; display: block; }

    /* 題目面板：手機從下面滑上來，寬螢幕放在右邊，都疊在地圖上 */
    .sheet {
      position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; max-height: 70%;
      display: flex; flex-direction: column; gap: 10px;
      background: rgba(255,250,240,.97); border-top: 3px solid var(--line); border-radius: 24px 24px 0 0;
      box-shadow: 0 -6px 24px rgba(0,0,0,.2);
      padding-block: 14px calc(12px + env(safe-area-inset-bottom, 0px));
      padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
      animation: slideUp .3s ease;
    }
    @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } }
    .sheet > * { width: 100%; max-width: 640px; margin: 0 auto; }
    .sheet-scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
    .sheet-foot { flex: none; display: flex; flex-direction: column; gap: 8px; }
    #game-screen.encountering .map-box { display: none; }
    .sheet .key { padding: 7px 0; font-size: 1.45rem; }
    @media (min-width: 760px) and (min-aspect-ratio: 1/1) {
      .sheet {
        left: auto; top: calc(70px + env(safe-area-inset-top, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        right: max(12px, env(safe-area-inset-right, 0px)); width: 430px; max-height: none;
        border: 3px solid var(--line); border-radius: 24px; padding: 16px; animation: slideIn .3s ease;
      }
      @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
      .sheet .key { padding: 9px 0; font-size: 1.6rem; }
    }
    /* 橫拿手機（又寬又矮）：題目在左、鍵盤在右 */
    @media (max-height: 520px) and (min-aspect-ratio: 1/1) {
      .sheet {
        left: auto; top: calc(8px + env(safe-area-inset-top, 0px)); bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        right: max(8px, env(safe-area-inset-right, 0px)); width: min(640px, 68%); max-height: none;
        flex-direction: row; gap: 12px; border: 3px solid var(--line); border-radius: 20px; padding: 10px 12px;
        animation: slideIn .3s ease;
      }
      .sheet > * { margin: 0; max-width: none; }
      .sheet-scroll { flex: 1 1 56%; }
      .sheet-foot { flex: 0 0 42%; justify-content: flex-end; }
      .sheet .key { padding: 4px 0; font-size: 1.25rem; border-radius: 12px; }
      .sheet .keypad { gap: 6px; }
      .sheet .feedback { font-size: .9rem; }
      .sheet .btn { padding: 10px; font-size: 1.1rem; }
      .enc { gap: 8px; }
      .portrait { width: 46px; height: 46px; font-size: 1.8rem; border-radius: 14px; }
      .enc-title { font-size: 1.05rem; }
      .story { font-size: 1rem; line-height: 1.6; }
      .story b { font-size: 1.12rem; }
      .answer-box { height: 48px; font-size: 1.7rem; min-width: 80px; }
      .answer-row { font-size: 1.15rem; }
      .dpad { grid-template-columns: repeat(3, 48px); grid-template-rows: repeat(3, 48px); }
      .guide { max-width: 230px; font-size: .78rem; padding: 6px 10px; }
      .minimap { width: 104px; }
      .legend { max-width: 104px; }
      @keyframes slideIn { from { transform: translateX(40px); opacity: 0; } }
    }

    /* 任務 / 戰鬥卡 */
    .enc { display: flex; flex-direction: column; gap: 12px; }
    .enc-head { display: flex; gap: 12px; align-items: center; }
    .portrait {
      font-size: 2.5rem; width: 62px; height: 62px; flex: none; border-radius: 18px; background: #fff;
      border: 3px solid var(--line); display: flex; align-items: center; justify-content: center;
    }
    .enc.battle .portrait { border-color: var(--red); background: #fdecee; }
    .enc-head .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
    .enc-kind { color: var(--accent); font-weight: bold; font-size: .85rem; letter-spacing: .08em; }
    .enc.battle .enc-kind { color: var(--red); }
    .enc-title { font-size: 1.25rem; text-wrap: balance; }
    .hpbar { display: flex; gap: 4px; align-items: center; font-size: .85rem; font-weight: bold; color: var(--red-dark); }
    .hpbar i { display: block; width: 22px; height: 12px; border-radius: 4px; background: var(--red); border: 2px solid var(--red-dark); }
    .hpbar i.empty { background: #f4d6da; border-color: #e8b4bb; }

    .story { font-size: 1.18rem; line-height: 1.75; }
    .story b { color: var(--blue-dark); font-size: 1.32rem; padding: 0 2px; }
    .story .ask { display: block; margin-top: 6px; font-weight: bold; }

    .answer-row { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.4rem; font-weight: bold; flex-wrap: wrap; }
    .answer-box {
      min-width: 96px; padding: 0 12px; height: 60px; border-radius: 16px; font-size: 2.1rem;
      border: 4px dashed var(--accent); display: inline-flex; align-items: center; justify-content: center;
      color: var(--accent); background: #fff; font-variant-numeric: tabular-nums;
    }
    .answer-box.correct { border-style: solid; border-color: var(--green); color: var(--green); background: #e8f8ee; }
    .answer-box.wrong { border-style: solid; border-color: var(--red); color: var(--red); background: #fdecee; animation: shake .4s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

    .tools { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .tool { border: 3px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px; font: inherit; font-weight: bold; color: var(--ink); cursor: pointer; }
    .tool:active { transform: scale(.96); }

    .hint { border-top: 3px dashed var(--line); padding-top: 12px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
    .hint-label { color: var(--muted); font-weight: bold; }
    .equation { font-size: 2.1rem; font-weight: bold; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
    .equation .op { color: var(--accent); }

    /* 直式 */
    .vertical { --cell: 52px; display: inline-grid; justify-content: center; column-gap: 6px; row-gap: 4px; font-size: 2.2rem; font-weight: bold; margin: 0 auto; font-variant-numeric: tabular-nums; }
    .vertical .cell { width: var(--cell); height: 50px; display: flex; align-items: center; justify-content: center; position: relative; }
    .vertical .op-cell { color: var(--accent); }
    .vertical .line { grid-column: 1 / -1; border-top: 5px solid var(--ink); border-radius: 3px; margin: 2px 0 4px; }
    .vertical .helper { height: 32px; font-size: 1rem; color: var(--blue-dark); border: none; background: none; font-family: inherit; font-weight: bold; }
    button.helper { border: 2px dashed var(--line); border-radius: 10px; cursor: pointer; width: 38px; justify-self: center; }
    button.helper.on { border-style: solid; border-color: var(--blue); background: #e3f0fb; }
    .vertical .digit-btn { font: inherit; color: inherit; background: none; border: none; cursor: pointer; border-radius: 12px; width: 100%; height: 100%; }
    .vertical .struck { color: #c9bca8; text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 4px; }
    .vertical .ten-badge { position: absolute; top: -6px; left: -6px; font-size: .8rem; color: var(--blue-dark); background: #e3f0fb; border-radius: 8px; padding: 0 4px; line-height: 1.4; }
    .vbox { border: 4px dashed #f2c2a5; border-radius: 14px; background: #fff; color: var(--accent); }
    .vbox.active { border-style: solid; border-color: var(--accent); box-shadow: 0 0 0 4px #ffe3d2; }
    .vbox.correct { border-style: solid; border-color: var(--green); color: var(--green); background: #e8f8ee; box-shadow: none; }
    .vbox.wrong { border-style: solid; border-color: var(--red); color: var(--red); background: #fdecee; animation: shake .4s; box-shadow: none; }
    .v-hint { font-size: .9rem; color: var(--muted); line-height: 1.5; }

    .feedback { min-height: 26px; text-align: center; font-size: 1.12rem; font-weight: bold; line-height: 1.55; }
    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }
    .feedback:empty { display: none; }

    .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .key {
      border: 3px solid var(--line); border-radius: 16px; padding: 9px 0; font-size: 1.6rem; font-weight: bold;
      font-family: inherit; background: #fff; color: var(--ink); box-shadow: var(--shadow); cursor: pointer;
      transition: transform .08s, box-shadow .08s;
    }
    .key:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(58,46,34,.14); }
    .key.del { color: var(--red); }
    .key.ok { background: var(--green); border-color: var(--green-dark); color: #fff; box-shadow: 0 5px 0 var(--green-dark); }

    /* ---------- 結果畫面 ---------- */
    .castle-big { font-size: 4.5rem; text-align: center; animation: floaty 1.2s ease-in-out infinite alternate; }
    @keyframes floaty { to { transform: translateY(-8px); } }
    .result-title { text-align: center; font-size: 1.7rem; text-wrap: balance; }
    .result-stars { text-align: center; font-size: 2.4rem; letter-spacing: 4px; }
    .result-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .stat { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 10px; text-align: center; }
    .stat .num { font-size: 1.6rem; font-weight: bold; font-variant-numeric: tabular-nums; }
    .stat .lbl { color: var(--muted); font-size: .9rem; }
    .review { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    .review-item { background: #fdecee; border-radius: 12px; padding: 10px 12px; line-height: 1.6; font-size: 1rem; }
    .review-item .eq { font-weight: bold; color: var(--green-dark); }
    .review-item .yours { color: var(--red); }

    .modal { position: fixed; inset: 0; background: rgba(58,46,34,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-box { background: var(--paper); border-radius: 22px; padding: 22px 18px; max-width: 340px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 14px; }
    .modal-box p { font-size: 1.15rem; line-height: 1.6; }
    .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .modal-actions .btn { font-size: 1.05rem; padding: 12px; }

    .confetti { position: fixed; top: -20px; width: 12px; height: 12px; pointer-events: none; z-index: 99; animation: fall linear forwards; }
    @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

    @media (max-width: 400px) {
      .vertical { --cell: 44px; font-size: 1.9rem; }
      .story { font-size: 1.08rem; }
      .pill { padding: 5px 7px; }
      .pill.hearts { font-size: .8rem; }
      .dpad { grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(3, 54px); }
      .minimap { width: 104px; }
      .legend { max-width: 104px; }
      .guide { font-size: .8rem; padding: 8px 10px; }
      .guide b { font-size: .88rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- 開始畫面 -->
    <section class="screen active" id="start-screen">
      <div class="hero">
        <div class="hero-art" aria-hidden="true"><img id="hero-knight" alt="" /><span>🐺</span><span>🗺️</span><span>🏰</span></div>
        <h1>小騎士數學冒險</h1>
        <p>每次出發都是一張新地圖！上下左右探索，<br>幫助村民、打倒野獸，打開水晶城堡的大門。</p>
      </div>

      <div class="card">
        <h2>🛡️ 騎士的名字</h2>
        <div class="name-row">
          <input id="knight-name" type="text" maxlength="6" value="小騎士" autocomplete="off" aria-label="騎士的名字" />
        </div>
      </div>

      <div class="card">
        <h2>① 要練習什麼？</h2>
        <div class="options" data-group="mode">
          <button class="opt selected" data-value="add"><span class="big">➕</span>加法</button>
          <button class="opt" data-value="sub"><span class="big">➖</span>減法</button>
          <button class="opt" data-value="mix"><span class="big">🔀</span>混合</button>
        </div>
      </div>

      <div class="card">

        else { a = rand(1, L - 1); b = rand(1, L - a); }
      } else {
        if (L === 100) { a = rand(20, 100); b = rand(3, a - 1); }
        else { a = rand(3, L); b = rand(1, a - 1); }

      return { a, b, answer: op === '+' ? a + b : a - b };

    function drawTemplate(kind, op) {
      const key = kind + op;
      const pool = kind === 'npc' ? NPC_QUESTS[op] : BATTLE_QUESTS[op];
      if (!bags[key] || bags[key].length === 0) bags[key] = shuffle(pool);
      return bags[key].pop();
    }

    function makeQuestion(kind, beastName) {
      const op = pickOp();
      const tpl = drawTemplate(kind, op);
      const nums = makeNumbers(op);
      const html = tpl.text(nums.a, nums.b, settings.name, beastName || '');
      return { kind, op, tpl, ...nums, html, unit: tpl.unit, tries: 0, hinted: false };
    }

    // =====================================================================
    // 隨機地圖
    // =====================================================================
    // 產生地圖，並且檢查到能走到終點才拿來玩；檢查沒過就整張重新產生
    function generateWorld(n) {
      let world = null;
      for (let attempt = 1; attempt <= 60; attempt++) {
        world = buildWorld(n);
        world.attempts = attempt;
        if (validateWorld(world)) return world;
      }
      // 理論上不會走到這裡；萬一真的發生，就直接鋪一條直直的路到城門
      forceRoad(world);
      return world;
    }

    const ROAD = new Set([T.PATH, T.BRIDGE, T.GATE]);

    // 從 from 出發，能走到的格子。canStep 決定哪些格子可以走
    function flood(world, from, canStep) {
      const { W, H, tiles } = world;
      const seen = Array.from({ length: H }, () => new Array(W).fill(false));
      const queue = [from];
      seen[from.y][from.x] = true;
      for (let i = 0; i < queue.length; i++) {
        const c = queue[i];
        for (const [dx, dy] of Object.values(DIRS)) {
          const nx = c.x + dx, ny = c.y + dy;
          if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen[ny][nx] || !canStep(tiles[ny][nx])) continue;
          seen[ny][nx] = true;
          queue.push({ x: nx, y: ny });
        }
      }
      return seen;
    }

    // 檢查三件事：
    // 1. 只走「道路」（土路、木橋），就能從村莊走到每個目標和城門
    // 2. 所有目標、寶箱和城門都走得到
    // 3. 城門前面有路可以進去，目標不會擋在城門上
    function validateWorld(world) {
      const { start, gate, pois, bossPos, chests, tiles } = world;
      const targets = [...pois, bossPos];
      if (tiles[start.y][start.x] !== T.PATH || tiles[gate.y][gate.x] !== T.GATE) return false;
      if (targets.some(t => t.x === gate.x && t.y === gate.y)) return false;

      const road = flood(world, start, t => ROAD.has(t));
      if (!road[gate.y][gate.x]) return false;
      if (targets.some(t => !road[t.y][t.x])) return false;

      const walk = flood(world, start, t => !SOLID.has(t));
      if ([...targets, ...chests].some(t => !walk[t.y][t.x])) return false;

      const left = tiles[gate.y][gate.x - 1];
      return ROAD.has(left);
    }

    function forceRoad(world) {
      const { tiles, start, gate, pois, bossPos } = world;
      const pave = (x, y) => { if (tiles[y][x] === T.WATER) tiles[y][x] = T.BRIDGE; else if (!ROAD.has(tiles[y][x])) tiles[y][x] = T.PATH; };
      const route = [start, ...pois, bossPos, { x: gate.x - 1, y: gate.y }];
      for (let i = 0; i < route.length - 1; i++) {
        const a = route[i], b = route[i + 1];
        for (let x = a.x; x !== b.x; x += Math.sign(b.x - x)) pave(x, a.y);
        for (let y = a.y; y !== b.y; y += Math.sign(b.y - y)) pave(b.x, y);
        pave(b.x, b.y);
      }
      tiles[gate.y][gate.x] = T.GATE;
      // 走不到的寶箱就拿掉
      const walk = flood(world, start, t => !SOLID.has(t));
      world.chests = world.chests.filter(c => walk[c.y][c.x]);
    }

    function buildWorld(n) {
      const [W, H] = MAP_SIZES[n] || MAP_SIZES[8];
      const tiles = Array.from({ length: H }, () => new Array(W).fill(T.GRASS));
      const vari = Array.from({ length: H }, () => Array.from({ length: W }, () => Math.random()));
      const inside = (x, y) => x >= 0 && y >= 0 && x < W && y < H;
      const set = (x, y, t) => { if (inside(x, y)) tiles[y][x] = t; };

      // 外圍是森林
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        if (x < 2 || y < 2 || x >= W - 2 || y >= H - 2) tiles[y][x] = T.TREE;
      }
      // 樹林、石頭、花
      const clusters = Math.floor((W * H) / 40);
      for (let c = 0; c < clusters; c++) {
        const cx = rand(2, W - 3), cy = rand(2, H - 3), r = rand(1, 3);
        for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy <= r * r + Math.random() * 2) set(cx + dx, cy + dy, T.TREE);
        }
      }
      for (let k = 0; k < (W * H) / 55; k++) { const x = rand(2, W - 3), y = rand(2, H - 3); if (tiles[y][x] === T.GRASS) tiles[y][x] = T.ROCK; }
      for (let k = 0; k < (W * H) / 22; k++) { const x = rand(2, W - 3), y = rand(2, H - 3); if (tiles[y][x] === T.GRASS) tiles[y][x] = T.FLOWER; }

      // 河流：從上往下彎彎曲曲流過地圖
      const riverCount = W >= 38 ? 2 : 1;
      for (let r = 0; r < riverCount; r++) {
        let x = Math.floor(W * (riverCount === 1 ? rand(40, 60) : (r === 0 ? rand(28, 40) : rand(60, 72))) / 100);
        const wide = Math.random() < .5;
        for (let y = 0; y < H; y++) {
          set(x, y, T.WATER);
          if (wide) set(x + 1, y, T.WATER);
          if (Math.random() < .35) x = clamp(x + pick([-1, 1]), 8, W - 10);
          set(x, y, T.WATER);
        }
      }

      // 起點小村莊（左邊）和城堡（右邊）
      const start = { x: 4, y: rand(5, H - 6) };
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(start.x + dx, start.y + dy, T.GRASS);
      set(start.x - 1, start.y - 2, T.HOUSE);
      set(start.x + 1, start.y - 2, T.HOUSE);

      const cy = rand(5, H - 6);
      const castle = { x: W - 4, y: cy - 1 }; // 城堡佔 2x2：x W-4..W-3, y cy-1..cy
      for (let dy = -3; dy <= 2; dy++) for (let dx = -4; dx <= 1; dx++) set(W - 4 + dx, cy + dy, T.GRASS);
      for (let dy = -1; dy <= 0; dy++) for (let dx = 0; dx <= 1; dx++) set(W - 4 + dx, cy + dy, T.CASTLE);
      const gate = { x: W - 5, y: cy };
      set(gate.x, gate.y, T.GATE);
      const bossPos = { x: W - 7, y: cy };

      // 村民和野獸分散在地圖上
      const kinds = [];
      const beastCount = Math.floor((n - 1) / 2);
      for (let i = 0; i < n - 1; i++) kinds.push(i < beastCount ? 'beast' : 'npc');
      let order = shuffle(kinds);
      if (order[0] === 'beast') { const j = order.indexOf('npc'); if (j > 0) { order[0] = 'npc'; order[j] = 'beast'; } }

      const pois = [];
      const x0 = 8, x1 = W - 10, span = (x1 - x0) / order.length;
      order.forEach((k, i) => {
        let best = null;
        for (let tries = 0; tries < 30; tries++) {
          const x = rand(Math.floor(x0 + i * span), Math.floor(x0 + (i + 1) * span) - 1);
          const y = i % 2 === 0 ? rand(3, Math.floor(H / 2) - 1) : rand(Math.floor(H / 2), H - 4);
          const t = tiles[y][x];
          if (t === T.WATER || t === T.HOUSE || t === T.CASTLE || t === T.GATE) continue;
          if (pois.some(p => Math.abs(p.x - x) + Math.abs(p.y - y) < 4)) continue;
          best = { x, y, kind: k };
          break;
        }
        if (!best) best = { x: Math.floor(x0 + (i + .5) * span), y: Math.floor(H / 2) + (i % 2 ? 3 : -3), kind: k };
        pois.push(best);
      });

      // 開路：起點 → 每個目標 → 魔王 → 城門。遇到河就搭橋，遇到樹林就砍出小路
      const carve = (a, b) => {
        let x = a.x, y = a.y;
        let guard = 0;
        while ((x !== b.x || y !== b.y) && guard++ < 500) {
          const dx = Math.sign(b.x - x), dy = Math.sign(b.y - y);
          const goX = dx !== 0 && (dy === 0 || Math.random() < (Math.abs(b.x - x) / (Math.abs(b.x - x) + Math.abs(b.y - y))));
          if (goX) x += dx; else y += dy;
          const t = tiles[y][x];
          if (t === T.WATER) tiles[y][x] = T.BRIDGE;
          else if (t === T.TREE || t === T.ROCK || t === T.GRASS || t === T.FLOWER || t === T.HOUSE) tiles[y][x] = T.PATH;
        }
      };
      const route = [{ x: start.x + 1, y: start.y }, ...pois, bossPos, gate];
      carve(start, route[0]);
      for (let i = 0; i < route.length - 1; i++) carve(route[i], route[i + 1]);

      // 目標周圍清出空地
      [...pois, bossPos].forEach(p => {
        for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
          const t = inside(p.x + dx, p.y + dy) ? tiles[p.y + dy][p.x + dx] : null;
          if (t === T.TREE || t === T.ROCK) set(p.x + dx, p.y + dy, T.GRASS);
        }
        if (tiles[p.y][p.x] !== T.BRIDGE) tiles[p.y][p.x] = T.PATH;
      });
      set(start.x, start.y, T.PATH);
      tiles[gate.y][gate.x] = T.GATE;

      // 從起點走得到的格子
      const reach = Array.from({ length: H }, () => new Array(W).fill(false));
      const queue = [start];
      reach[start.y][start.x] = true;
      while (queue.length) {
        const c = queue.shift();
        for (const [dx, dy] of Object.values(DIRS)) {
          const nx = c.x + dx, ny = c.y + dy;
          if (!inside(nx, ny) || reach[ny][nx] || SOLID.has(tiles[ny][nx])) continue;
          reach[ny][nx] = true;
          queue.push({ x: nx, y: ny });
        }
      }

      // 寶箱放在走得到、又離目標遠一點的地方
      const chests = [];
      const chestCount = Math.max(3, Math.round(n / 2));
      for (let tries = 0; tries < 400 && chests.length < chestCount; tries++) {
        const x = rand(3, W - 4), y = rand(2, H - 3);
        if (!reach[y][x] || tiles[y][x] === T.GATE || tiles[y][x] === T.BRIDGE) continue;
        const spot = { x, y };
        if (manhattan(spot, start) < 5) continue;
        if ([...pois, bossPos, gate, ...chests].some(p => manhattan(p, spot) < 4)) continue;
        chests.push(spot);
      }

      return { W, H, tiles, vari, start, castle, gate, bossPos, pois, chests };
    }

    // =====================================================================
    // 開始遊戲
    // =====================================================================
    function startGame() {
      const name = $('knight-name').value.trim() || '小騎士';
      settings.name = name;
      try { localStorage.setItem('knight-name', name); } catch (e) {}
      bags = {};
      if (state) cancelAnimationFrame(state.raf);

      const world = generateWorld(settings.count);
      const beastBag = shuffle(BEASTS);
      const ents = [];
      world.pois.forEach(p => {
        if (p.kind === 'npc') {
          const q = makeQuestion('npc');
          ents.push({ type: 'npc', x: p.x, y: p.y, icon: q.tpl.icon, q, done: false });
        } else {
          const beast = beastBag.pop() || pick(BEASTS);
          ents.push({ type: 'beast', x: p.x, y: p.y, hx: p.x, hy: p.y, icon: beast.icon, beast, hp: beast.hp, done: false, nextMove: 0 });
        }
      });
      ents.push({ type: 'beast', x: world.bossPos.x, y: world.bossPos.y, hx: world.bossPos.x, hy: world.bossPos.y, icon: BOSS.icon, beast: BOSS, hp: BOSS.hp, done: false, still: true });
      world.chests.forEach(c => ents.push({ type: 'chest', x: c.x, y: c.y, coins: rand(2, 4), done: false }));

      const now = performance.now();
      state = {
        world, ents,
        p: { x: world.start.x, y: world.start.y, fx: world.start.x, fy: world.start.y, t0: 0, moving: false, face: 1 },
        cam: { x: 0, y: 0, init: false },
        explored: Array.from({ length: world.H }, () => new Array(world.W).fill(false)),
        hearts: MAX_HEARTS, coins: 0, stars: 0, perfect: 0, asked: 0,
        npcsDone: 0, beastsDone: 0,
        npcTotal: ents.filter(e => e.type === 'npc').length,
        beastTotal: ents.filter(e => e.type === 'beast').length,
        active: null, q: null, input: '', locked: true, marks: {}, wrongs: [],
        effects: [], finished: false, raf: 0, last: now, miniT: 0, gateOpen: false,
      };
      heldDirs.length = 0;

      paintStatic();
      reveal();
      $('encounter').hidden = true;
      $('controls').hidden = false;
      $('game-screen').classList.remove('encountering');
      $('toast').hidden = true;
      showScreen('game-screen');
      updateHud();
      toast(`🗺️ 新地圖產生了！${settings.name}從小村莊出發！`, 2600);
      state.raf = requestAnimationFrame(loop);
    }

    // =====================================================================
    // 畫地圖（不會變的部分先畫在一張大畫布上）
    // =====================================================================
    let staticLayer = null;
    const DPR = Math.min(2, window.devicePixelRatio || 1);

    function emoji(g, ch, x, y, size) {
      g.font = `${size}px ${EMOJI_FONT}`;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(ch, x, y);
    }

    function paintStatic(scale = DPR) {
      const { W, H, tiles, vari } = state.world;
      staticLayer = document.createElement('canvas');
      staticLayer.width = Math.round(W * TS * scale);
      staticLayer.height = Math.round(H * TS * scale);
      state.staticScale = scale;
      const g = staticLayer.getContext('2d');
      g.scale(scale, scale);

      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        const t = tiles[y][x], r = vari[y][x];
        const px = x * TS, py = y * TS;
        if (t === T.WATER || t === T.BRIDGE) {
          g.fillStyle = '#5cb5ea';
          g.fillRect(px, py, TS, TS);
          g.strokeStyle = '#9ad6f7';
          g.lineWidth = 2;
          g.beginPath();
          g.arc(px + 12 + r * 14, py + 14 + r * 10, 6, Math.PI * 1.1, Math.PI * 1.9);
          g.arc(px + 28 - r * 8, py + 32 - r * 6, 5, Math.PI * 1.1, Math.PI * 1.9);
          g.stroke();
        } else if (t === T.PATH || t === T.GATE) {
          g.fillStyle = '#e6c891';
          g.fillRect(px, py, TS, TS);
          g.fillStyle = '#d3b274';
          g.fillRect(px + 8 + r * 20, py + 10 + r * 16, 3, 3);
          g.fillRect(px + 26 - r * 10, py + 30 - r * 12, 3, 3);
        } else {
          g.fillStyle = (x + y) % 2 ? '#93d062' : '#8cca5b';
          g.fillRect(px, py, TS, TS);
          if (r < .35) {
            g.strokeStyle = '#6fb544';
            g.lineWidth = 2;
            g.beginPath();
            const tx = px + 10 + r * 60, ty = py + 30;
            g.moveTo(tx, ty); g.lineTo(tx - 3, ty - 7);
            g.moveTo(tx + 4, ty); g.lineTo(tx + 5, ty - 8);
            g.stroke();
          }
        }

        if (t === T.BRIDGE) {
          const horiz = (x > 0 && tiles[y][x - 1] !== T.WATER) || (x < W - 1 && tiles[y][x + 1] !== T.WATER);
          g.fillStyle = '#c08a52';
          g.fillRect(px + (horiz ? 0 : 6), py + (horiz ? 6 : 0), horiz ? TS : TS - 12, horiz ? TS - 12 : TS);
          g.strokeStyle = '#8e5f30';
          g.lineWidth = 2;
          g.beginPath();
          for (let k = 8; k < TS; k += 9) {
            if (horiz) { g.moveTo(px + k, py + 6); g.lineTo(px + k, py + TS - 6); }
            else { g.moveTo(px + 6, py + k); g.lineTo(px + TS - 6, py + k); }
          }
          g.stroke();
        }
        if (t === T.TREE) emoji(g, r < .55 ? '🌳' : '🌲', px + TS / 2, py + TS / 2, TS * .9);
        if (t === T.ROCK) emoji(g, '🪨', px + TS / 2, py + TS / 2 + 2, TS * .62);
        if (t === T.FLOWER) emoji(g, r < .4 ? '🌼' : r < .7 ? '🌷' : '🌸', px + 12 + r * 18, py + 14 + r * 14, TS * .38);
        if (t === T.HOUSE) emoji(g, '🏡', px + TS / 2, py + TS / 2, TS * .95);
      }
      const c = state.world.castle;
      emoji(g, '🏰', (c.x + 1) * TS, (c.y + 1) * TS - 4, TS * 2.1);
    }

    // =====================================================================
    // 遊戲迴圈
    // =====================================================================
    const view = $('view');
    const vctx = view.getContext('2d');
    const mini = $('minimap');
    const mctx = mini.getContext('2d');

    function loop(now) {
      if (!state || state.finished) return;
      const dt = Math.min(0.05, (now - state.last) / 1000);
      state.last = now;

      updatePlayer(now);
      updateBeasts(now);
      draw(now, dt);
      if (now - state.miniT > 200) { drawMinimap(); state.miniT = now; }
      state.raf = requestAnimationFrame(loop);
    }

    // 位置：走路時在兩格之間平滑移動
    function lerpPos(o, now, dur) {
      if (!o.moving) return { x: o.x, y: o.y, k: 1 };
      const k = clamp((now - o.t0) / dur, 0, 1);
      return { x: o.fx + (o.x - o.fx) * k, y: o.fy + (o.y - o.fy) * k, k };
    }

    const tileAt = (x, y) => {
      const w = state.world;
      return (x < 0 || y < 0 || x >= w.W || y >= w.H) ? T.TREE : w.tiles[y][x];
    };
    // 已經完成的村民和打倒的野獸不會擋路，避免把唯一的小路堵住
    const blockerAt = (x, y) => state.ents.find(e => e.type !== 'chest' && !e.done && e.x === x && e.y === y);
    const beastsLeft = () => state.ents.filter(e => e.type === 'beast' && !e.done).length;

    function updatePlayer(now) {
      const p = state.p;
      if (p.moving && now - p.t0 >= STEP_MS) {
        p.moving = false;
        onArrive();
        if (!state || state.finished) return;
      }
      if (!p.moving && !state.active && heldDirs.length) tryMove(heldDirs[heldDirs.length - 1], now);
    }

    function tryMove(dir, now) {
      const p = state.p;
      const [dx, dy] = DIRS[dir];
      if (dx) p.face = dx;
      const nx = p.x + dx, ny = p.y + dy;

      const ent = blockerAt(nx, ny);
      if (ent) { startEncounter(ent); return; }
      const t = tileAt(nx, ny);
      if (t === T.GATE && !state.gateOpen) {
        if (now - (p.bumpT || 0) > 900) {
          p.bumpT = now;
          toast(`🔒 城門鎖住了！先打倒所有野獸（還有 ${beastsLeft()} 隻）`, 2400);
          sound('bad');
        }
        return;
      }
      if (SOLID.has(t)) return;

      p.fx = p.x; p.fy = p.y;
      p.x = nx; p.y = ny;
      p.t0 = now;
      p.moving = true;
      sound('step');
    }

    function onArrive() {
      const p = state.p;
      reveal();
      const chest = state.ents.find(e => e.type === 'chest' && !e.done && e.x === p.x && e.y === p.y);
      if (chest) openChest(chest);
      if (tileAt(p.x, p.y) === T.GATE && state.gateOpen) { arriveCastle(); return; }
      const near = state.ents.find(e => (e.type === 'npc' || e.type === 'beast') && !e.done && manhattan(e, p) === 1);
      if (near) startEncounter(near);
    }

    function updateBeasts(now) {
      if (state.active) return;
      const p = state.p;
      state.ents.forEach(e => {
        if (e.type !== 'beast' || e.done) return;
        if (e.moving && now - e.t0 >= BEAST_STEP_MS) {
          e.moving = false;
          if (!state.active && manhattan(e, p) === 1) {
            startEncounter(e);
          }
        }
        if (e.still || e.moving || now < e.nextMove) return;
        e.nextMove = now + rand(900, 2000);
        const [dx, dy] = pick(Object.values(DIRS));
        const nx = e.x + dx, ny = e.y + dy;
        if (Math.abs(nx - e.hx) > 2 || Math.abs(ny - e.hy) > 2) return;
        const t = tileAt(nx, ny);
        if (SOLID.has(t) || t === T.GATE) return;
        if (blockerAt(nx, ny) || (nx === p.x && ny === p.y)) return;
        e.fx = e.x; e.fy = e.y; e.x = nx; e.y = ny; e.t0 = now; e.moving = true;
      });
    }

    function reveal() {
      const { W, H } = state.world;
      const p = state.p;
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = p.x + dx, y = p.y + dy;
        if (x >= 0 && y >= 0 && x < W && y < H && dx * dx + dy * dy <= 18) state.explored[y][x] = true;
      }
    }

    // =====================================================================
    // 繪圖
    // =====================================================================
    function draw(now, dt) {
      const cw = view.clientWidth, ch = view.clientHeight;
      if (view.width !== Math.round(cw * DPR) || view.height !== Math.round(ch * DPR)) {
        view.width = Math.round(cw * DPR);
        view.height = Math.round(ch * DPR);
      }
      const g = vctx;
      const { W, H } = state.world;
      const mapW = W * TS, mapH = H * TS;

      // 大螢幕把地圖放大，讓畫面不會太空
      const zoom = clamp(Math.min(cw / (15 * TS), ch / (10 * TS)), 1, 2.2);
      const want = Math.min(DPR * zoom, Math.sqrt(16e6 / (mapW * mapH)));
      if (Math.abs(want - state.staticScale) > 0.05) paintStatic(want);
      g.setTransform(DPR * zoom, 0, 0, DPR * zoom, 0, 0);
      const vw = cw / zoom, vh = ch / zoom;

      // 題目面板蓋住的地方不算，鏡頭對準剩下看得到的區域
      // 看得到的範圍：x0~x1、y0~y1（遇到村民或野獸時，扣掉上方的狀態列和題目面板）
      let x0 = 0, x1 = vw, y0 = 0, y1 = vh;
      const sheet = $('encounter');
      if (!sheet.hidden) {
        const r = sheet.getBoundingClientRect();
        y0 = $('goals').getBoundingClientRect().bottom / zoom;
        if (r.width < cw * 0.75) x1 = Math.max(vw * .3, r.left / zoom);
        else y1 = Math.max(y0 + vh * .15, r.top / zoom);
      }

      // 鏡頭跟著騎士；遇到村民或野獸時，對準兩個人中間
      const pp = lerpPos(state.p, now, STEP_MS);
      let fx = pp.x * TS + TS / 2, fy = pp.y * TS + TS / 2;
      if (state.active) { fx = (fx + state.active.x * TS + TS / 2) / 2; fy = (fy + state.active.y * TS + TS / 2) / 2; }
      // 讓焦點落在看得到的範圍正中間；必要時可以超出地圖邊緣（超出的地方會被狀態列或面板蓋住）
      const camFor = (focus, a, b, view, map) => {
        if (map <= view && a === 0 && b === view) return -(view - map) / 2;
        return clamp(focus - (a + b) / 2, -a, Math.max(-a, map - b));
      };
      const tx = camFor(fx, x0, x1, vw, mapW);
      const ty = camFor(fy, y0, y1, vh, mapH);
      if (!state.cam.init) { state.cam.x = tx; state.cam.y = ty; state.cam.init = true; }
      const ease = Math.min(1, dt * 8);
      state.cam.x += (tx - state.cam.x) * ease;
      state.cam.y += (ty - state.cam.y) * ease;
      const px = DPR * zoom;
      const cx = Math.round(state.cam.x * px) / px, cy = Math.round(state.cam.y * px) / px;

      g.fillStyle = '#5fa83a';
      g.fillRect(0, 0, vw, vh);
      g.save();
      g.translate(-cx, -cy);
      g.drawImage(staticLayer, 0, 0, mapW, mapH);

      // 城門
      const gate = state.world.gate;
      if (state.gateOpen) emoji(g, '✨', gate.x * TS + TS / 2, gate.y * TS + TS / 2 + Math.sin(now / 250) * 3, TS * .55);
      else emoji(g, '🔒', gate.x * TS + TS / 2, gate.y * TS + TS / 2, TS * .5);

      // 物件依照 y 排序，前面的蓋住後面的
      const items = [];
      state.ents.forEach(e => { if (!e.gone) items.push({ kind: 'ent', e, pos: lerpPos(e, now, BEAST_STEP_MS) }); });
      items.push({ kind: 'player', pos: pp });
      items.sort((a, b) => a.pos.y - b.pos.y);

      items.forEach(it => {
        if (it.kind === 'player') drawKnight(g, it.pos, now);
        else drawEnt(g, it.e, it.pos, now);
      });

      // 飄起來的文字
      state.effects = state.effects.filter(f => now - f.t0 < 1100);
      state.effects.forEach(f => {
        const k = (now - f.t0) / 1100;
        g.globalAlpha = 1 - k;
        g.font = 'bold 18px "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
        g.textAlign = 'center';
        g.lineWidth = 4;
        g.strokeStyle = '#fff';
        g.strokeText(f.text, f.x, f.y - k * 40);
        g.fillStyle = f.color;
        g.fillText(f.text, f.x, f.y - k * 40);
        g.globalAlpha = 1;
      });
      g.restore();
    }

    function shadow(g, x, y, w) {
      g.fillStyle = 'rgba(0,0,0,.18)';
      g.beginPath();
      g.ellipse(x, y, w, w * .35, 0, 0, Math.PI * 2);
      g.fill();
    }

    function label(g, text, x, y, color, bg) {
      g.font = 'bold 12px "PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif';
      const w = g.measureText(text).width + 10;
      g.fillStyle = bg;
      g.beginPath();
      g.roundRect ? g.roundRect(x - w / 2, y - 9, w, 18, 8) : g.rect(x - w / 2, y - 9, w, 18);
      g.fill();
      g.fillStyle = color;
      g.textAlign = 'center';
      g.textBaseline = 'middle';
      g.fillText(text, x, y + 1);
    }

    function drawKnight(g, pos, now) {
      const p = state.p;
      let ox = 0, oy = 0;
      if (p.attackT && now - p.attackT < 320) {
        const k = Math.sin(Math.PI * (now - p.attackT) / 320) * 16;
        ox = (p.ax || 0) * k; oy = (p.ay || 0) * k;
      }
      let shake = 0;
      if (p.hurtT && now - p.hurtT < 450) shake = Math.sin((now - p.hurtT) / 25) * 4;
      const bob = p.moving ? Math.abs(Math.sin(now / 70)) * -3 : 0;
      const x = pos.x * TS + TS / 2 + ox + shake;
      const y = pos.y * TS + TS / 2 + oy;
      shadow(g, x, y + 18, 13);
      const w = 38, h = 44;
      g.save();
      g.translate(x, y + bob);
      if (p.face < 0) g.scale(-1, 1);
      if (knightImg.complete && knightImg.naturalWidth) g.drawImage(knightImg, -w / 2, -h / 2 - 2, w, h);
      else { g.fillStyle = '#3d8fd6'; g.beginPath(); g.arc(0, 0, 14, 0, Math.PI * 2); g.fill(); }
      g.restore();
      if (p.hurtT && now - p.hurtT < 450) {
        g.fillStyle = 'rgba(224,72,90,.35)';
        g.beginPath(); g.arc(x, y, 22, 0, Math.PI * 2); g.fill();
      }
      label(g, settings.name, x, y - 30, '#3a2e22', 'rgba(255,255,255,.88)');
    }

    function drawEnt(g, e, pos, now) {
      let x = pos.x * TS + TS / 2, y = pos.y * TS + TS / 2;
      let alpha = 1, scale = 1;
      if (e.type === 'chest') {
        if (e.done) {
          const k = (now - e.doneT) / 600;
          if (k >= 1) { e.gone = true; return; }
          alpha = 1 - k; y -= k * 20;
        }
        g.globalAlpha = alpha;
        emoji(g, e.done ? '✨' : '🎁', x, y + Math.sin(now / 300 + e.x) * 2, TS * .6);
        g.globalAlpha = 1;
        return;
      }
      if (e.type === 'beast' && e.done) {
        const k = Math.max(0, (now - e.doneT) / 700);
        if (k >= 1) { e.gone = true; return; }
        alpha = 1 - k; scale = 1 - k * .6;
      }
      if (e.hitT && now - e.hitT < 400) x += Math.sin((now - e.hitT) / 30) * 5;
      if (e.lungeT && now - e.lungeT < 360) {
        const k = Math.sin(Math.PI * (now - e.lungeT) / 360) * 16;
        x += Math.sign(state.p.x - e.x) * k;
        y += Math.sign(state.p.y - e.y) * k;
      }
      const boss = e.beast && e.beast.boss;
      const size = (boss ? TS * 1.45 : e.type === 'beast' ? TS * .95 : TS * .85) * scale;
      shadow(g, x, y + (boss ? 22 : 16), boss ? 22 : 13);
      g.globalAlpha = alpha;
      // 淡淡的底圈，讓綠色的動物在草地上也看得清楚
      g.fillStyle = e.type === 'beast' ? 'rgba(255,225,228,.75)' : 'rgba(255,246,214,.8)';
      g.strokeStyle = e.type === 'beast' ? 'rgba(224,72,90,.8)' : 'rgba(245,184,46,.9)';
      g.lineWidth = 2;
      g.beginPath();
      g.arc(x, y + (boss ? -4 : 1), size * .52, 0, Math.PI * 2);
      g.fill();
      if (!e.done) g.stroke();
      emoji(g, e.icon, x, y + (boss ? -6 : 0), size);
      if (e.hitT && now - e.hitT < 250) {
        g.fillStyle = 'rgba(255,255,255,.55)';
        g.beginPath(); g.arc(x, y, size / 2, 0, Math.PI * 2); g.fill();
      }
      g.globalAlpha = 1;

      const top = y - (boss ? 46 : 30);
      if (e.type === 'npc') {
        const b = Math.sin(now / 250) * 2;
        if (!e.done) label(g, '❗ 需要幫忙', x, top + b, '#3a2e22', 'rgba(255,240,200,.95)');
        else label(g, '✅', x, top, '#2fa85c', 'rgba(255,255,255,.9)');
      } else if (!e.done) {
        label(g, e.beast.name, x, top, '#fff', 'rgba(184,48,63,.9)');
      }
    }

    function drawMinimap() {
      const { W, H, tiles } = state.world;
      const s = 3;
      if (mini.width !== W * s) { mini.width = W * s; mini.height = H * s; }
      const g = mctx;
      const colors = {
        [T.GRASS]: '#8cca5b', [T.FLOWER]: '#8cca5b', [T.PATH]: '#e6c891', [T.GATE]: '#e6c891',
        [T.TREE]: '#3f8a35', [T.ROCK]: '#9b9b8f', [T.WATER]: '#5cb5ea', [T.BRIDGE]: '#c08a52',
        [T.HOUSE]: '#d2694a', [T.CASTLE]: '#9b6bff',
      };
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
        g.fillStyle = state.explored[y][x] ? colors[tiles[y][x]] : '#2e3b2a';
        g.fillRect(x * s, y * s, s, s);
      }
      const dot = (x, y, color, r) => {
        g.fillStyle = '#000';
        g.fillRect(x * s + 1 - r - 1, y * s + 1 - r - 1, r * 2 + 3, r * 2 + 3);
        g.fillStyle = color;
        g.fillRect(x * s + 1 - r, y * s + 1 - r, r * 2 + 1, r * 2 + 1);
      };
      const c = state.world.castle;
      dot(c.x + .5, c.y + .5, '#9b6bff', 3);
      state.ents.forEach(e => {
        if (e.done) return;
        if (e.type === 'npc') dot(e.x, e.y, '#f5b82e', 1);
        if (e.type === 'beast') dot(e.x, e.y, '#e0485a', e.beast.boss ? 2 : 1);
      });
      dot(state.p.x, state.p.y, '#fff', 2);
    }

    function addFloat(tileX, tileY, text, color) {
      state.effects.push({ x: tileX * TS + TS / 2, y: tileY * TS, text, color, t0: performance.now() });
    }

    let toastTimer = 0;
    function toast(text, ms = 1800) {
      const t = $('toast');
      t.textContent = text;
      t.hidden = false;
      t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.hidden = true; }, ms);
    }

    // =====================================================================
    // HUD
    // =====================================================================
    function updateHud() {
      $('heart-pill').textContent = '❤️'.repeat(state.hearts) + '🤍'.repeat(MAX_HEARTS - state.hearts);
      $('coin-count').textContent = state.coins;
      $('star-count').textContent = state.stars;
      $('goals').textContent = `🧑‍🌾 ${state.npcsDone}/${state.npcTotal}　⚔️ ${state.beastsDone}/${state.beastTotal}`;
      const left = beastsLeft();
      const npcLeft = state.npcTotal - state.npcsDone;
      $('guide').innerHTML = left === 0
        ? '<b>城門打開了！</b>看小地圖，走到紫色的城堡 🏰'
        : `<b>還有 ${left} 隻野獸、${npcLeft} 位村民</b>看右上角的小地圖找找看！打倒所有野獸，城門就會打開。`;
    }

    function bump(id) {
      const el = $(id);
      el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump');
    }

    function openChest(c) {
      c.done = true;
      c.doneT = performance.now();
      state.coins += c.coins;
      updateHud();
      bump('coin-pill');
      addFloat(c.x, c.y, `+${c.coins} 🪙`, '#c58a00');
      toast(`🎁 打開寶箱，得到 ${c.coins} 枚金幣！`);
      sound('coin');
    }

    // =====================================================================
    // 遇到村民 / 野獸
    // =====================================================================
    function startEncounter(ent) {
      if (state.active || state.finished) return;
      state.active = ent;
      heldDirs.length = 0;
      document.querySelectorAll('.pad').forEach(b => b.classList.remove('held'));
      const p = state.p;
      if (ent.x !== p.x) p.face = Math.sign(ent.x - p.x);
      $('controls').hidden = true;
      $('encounter').hidden = false;
      $('game-screen').classList.add('encountering');
      clearTimeout(toastTimer);
      $('toast').hidden = true;

      const enc = $('enc');
      if (ent.type === 'npc') {
        enc.classList.remove('battle');
        $('portrait').textContent = ent.icon;
        $('enc-kind').textContent = '村民的請求';
        $('enc-title').textContent = ent.q.tpl.title;
        $('hpbar').hidden = true;
        state.q = ent.q;
        sound('ding');
      } else {
        enc.classList.add('battle');
        $('portrait').textContent = ent.icon;
        $('enc-kind').textContent = ent.beast.boss ? '魔王戰！' : '野獸出現了！';
        $('enc-title').textContent = `${ent.beast.name}擋住了去路`;
        $('hpbar').hidden = false;
        renderHp(ent);
        state.q = makeQuestion('battle', ent.beast.name);
        sound('roar');
      }
      presentQuestion();
    }

    function renderHp(ent) {
      let html = '生命 ';
      for (let i = 0; i < ent.beast.hp; i++) html += `<i class="${i < ent.hp ? '' : 'empty'}"></i>`;
      $('hpbar').innerHTML = html;
    }

    function presentQuestion() {
      const q = state.q;
      state.input = '';
      state.marks = {};
      state.locked = false;
      state.asked++;
      $('story').innerHTML = q.html;
      $('unit').textContent = q.unit;
      $('hint').hidden = true;
      $('hint-btn').hidden = false;
      $('feedback').textContent = '';
      $('feedback').className = 'feedback';
      $('keypad').hidden = false;
      $('next-btn').hidden = true;
      $('sheet-scroll').scrollTop = 0;
      showAnswer('');
    }

    // ---------- 提示 ----------
    const verticalInput = () => settings.layout === 'v' && !$('hint').hidden;

    function showHint() {
      const q = state.q;
      if (!q || !$('hint').hidden) return;
      q.hinted = true;
      $('hint').hidden = false;
      $('hint-btn').hidden = true;
      $('hint-h').hidden = settings.layout === 'v';
      $('hint-v').hidden = settings.layout !== 'v';
      $('hint-h').innerHTML = `<span>${q.a}</span><span class="op">${opSign(q.op)}</span><span>${q.b}</span><span>=</span><span>?</span>`;
      $('v-hint').textContent = q.op === '+'
        ? '答案從最右邊的個位數開始填。滿 10 要進位，可以點上面的小格子記下「1」。'
        : '答案從最右邊的個位數開始填。不夠減就跟左邊借 1，點上面的數字可以做記號。';
      state.input = '';
      showAnswer('');
      // 把面板往下捲，讓算式露出來
      requestAnimationFrame(() => { const sc = $('sheet-scroll'); sc.scrollTo({ top: sc.scrollHeight, behavior: 'smooth' }); });
    }

    // ---------- 答案顯示 ----------
    function showAnswer(status) {
      const box = $('answer-box');
      box.className = 'answer-box' + (status ? ' ' + status : '');
      box.textContent = state.input === '' ? '?' : state.input;
      if (verticalInput()) renderVertical(status);
    }

    const digitsOf = (n) => String(n).split('').reverse().map(Number);
    const colsOf = (q) => Math.max(String(q.a).length, String(q.b).length, String(q.answer).length);

    function renderVertical(status) {
      const q = state.q;
      const cols = colsOf(q);
      const A = digitsOf(q.a), B = digitsOf(q.b);
      const box = $('vertical');
      box.style.gridTemplateColumns = `repeat(${cols + 1}, var(--cell))`;
      let html = '<div class="cell helper"></div>';
      for (let i = cols - 1; i >= 0; i--) {
        if (q.op === '+') {
          html += i >= 1
            ? `<button class="cell helper ${state.marks[i] ? 'on' : ''}" data-carry="${i}" aria-label="進位記號">${state.marks[i] ? '1' : ''}</button>`
            : '<div class="cell helper"></div>';
        } else {
          const borrowed = state.marks[i] && A[i] !== undefined;
          html += `<div class="cell helper">${borrowed ? (A[i] === 0 ? 9 : A[i] - 1) : ''}</div>`;
        }
      }
      html += '<div class="cell"></div>';
      for (let i = cols - 1; i >= 0; i--) {
        const d = A[i];
        if (d === undefined) { html += '<div class="cell"></div>'; continue; }
        const badge = (q.op === '-' && state.marks[i + 1]) ? '<span class="ten-badge">+10</span>' : '';
        html += (q.op === '-' && i >= 1)
          ? `<div class="cell">${badge}<button class="digit-btn ${state.marks[i] ? 'struck' : ''}" data-borrow="${i}" aria-label="借位">${d}</button></div>`
          : `<div class="cell">${badge}${d}</div>`;
      }
      html += `<div class="cell op-cell">${opSign(q.op)}</div>`;
      for (let i = cols - 1; i >= 0; i--) html += `<div class="cell">${B[i] !== undefined ? B[i] : ''}</div>`;
      html += '<div class="line"></div><div class="cell"></div>';
      const inp = state.input;
      for (let i = cols - 1; i >= 0; i--) {
        const ch = inp.length > i ? inp[inp.length - 1 - i] : '';
        let cls = 'cell vbox';
        if (status) cls += ' ' + status;
        else if (!state.locked && i === inp.length) cls += ' active';
        html += `<div class="${cls}">${ch}</div>`;
      }
      box.innerHTML = html;
    }

    $('vertical').addEventListener('click', (e) => {
      if (!state || state.locked) return;
      const t = e.target.closest('[data-carry],[data-borrow]');
      if (!t) return;
      const i = Number(t.dataset.carry ?? t.dataset.borrow);
      state.marks[i] = !state.marks[i];
      sound('tap');
      renderVertical('');
    });

    // ---------- 輸入 ----------
    function press(key) {
      if (!state || !state.active || state.locked) return;
      if (key === 'del') {
        state.input = verticalInput() ? state.input.slice(1) : state.input.slice(0, -1);
        sound('tap');
      } else if (key === 'ok') {
        if (state.input !== '') checkAnswer();
        return;
      } else if (verticalInput()) {
        if (state.input.length >= colsOf(state.q)) return;
        state.input = key + state.input; // 直式從個位數往左填
        sound('tap');
      } else {
        if (state.input.length >= 3) return;
        state.input = (state.input === '0' ? '' : state.input) + key;
        sound('tap');
      }
      showAnswer('');
    }

    function checkAnswer() {
      const q = state.q;
      const ent = state.active;
      const value = Number(state.input);
      const fb = $('feedback');
      q.tries++;

      if (value === q.answer) {
        const perfect = q.tries === 1 && !q.hinted;
        if (perfect) { state.stars++; state.perfect++; bump('star-pill'); }
        state.locked = true;
        showAnswer('correct');
        fb.className = 'feedback good';
        if (ent.type === 'npc') {
          const coins = perfect ? 3 : 2;
          addCoins(coins, ent);
          fb.innerHTML = `${pick(PRAISE)}${q.tpl.win}<br>獲得 🪙 ${coins} 枚${perfect ? '、⭐ 1 顆' : ''}`;
          sound('good');
          resolveEncounter();
        } else {
          knightAttack(ent, `${pick(PRAISE)}${settings.name}揮劍攻擊，${ent.beast.name}受到 1 點傷害！${perfect ? '（⭐ +1）' : ''}`);
        }
        return;
      }

      // 答錯
      if (q.tries === 1) state.wrongs.push({ ...q, yours: value, icon: ent.icon });
      fb.className = 'feedback bad';
      showHint();
      state.input = String(value);
      showAnswer('wrong');
      sound('bad');
      const hurtMsg = ent.type === 'beast' ? beastAttack(ent) : '';

      if (q.tries >= 2) {
        state.locked = true;
        setTimeout(() => { if (state && state.q === q) { state.input = String(q.answer); showAnswer('correct'); } }, 450);
        const reveal = `正確答案是 ${q.answer} ${q.unit}（${q.a} ${opSign(q.op)} ${q.b} = ${q.answer}）。`;
        if (ent.type === 'npc') {
          addCoins(1, ent);
          fb.innerHTML = `${reveal}<br>${q.tpl.win} 獲得 🪙 1 枚`;
          resolveEncounter();
        } else {
          fb.innerHTML = `${hurtMsg}${reveal}`;
          $('keypad').hidden = true;
          // 記住答案後鼓起勇氣再攻擊一次，戰鬥一定會往前進
          setTimeout(() => { if (state && state.active === ent) knightAttack(ent, `${reveal}<br>${settings.name}記住答案，鼓起勇氣揮出一劍！`); }, 1300);
        }
      } else {
        fb.innerHTML = hurtMsg + pick(RETRY);
        state.input = '';
        setTimeout(() => { if (state && state.active && !state.locked) showAnswer(''); }, 700);
      }
    }

    function knightAttack(ent, text) {
      const fb = $('feedback');
      fb.className = 'feedback good';
      $('keypad').hidden = true;
      const p = state.p;
      p.attackT = performance.now();
      p.ax = Math.sign(ent.x - p.x);
      p.ay = Math.sign(ent.y - p.y);
      sound('slash');
      setTimeout(() => {
        if (!state || state.active !== ent) return;
        ent.hp = Math.max(0, ent.hp - 1);
        ent.hitT = performance.now();
        renderHp(ent);
        addFloat(ent.x, ent.y, '-1', '#e0485a');
        if (ent.hp <= 0) {
          addCoins(ent.beast.reward, ent);
          fb.innerHTML = `${text}<br>🎉 打倒${ent.beast.name}了！獲得 🪙 ${ent.beast.reward} 枚`;
          sound('win');
          resolveEncounter();
        } else {
          fb.innerHTML = `${text}<br>${ent.beast.name}還有 ${ent.hp} 點生命！`;
          showNext('fight', '下一回合 ⚔️');
        }
      }, 200);
    }

    function beastAttack(ent) {
      const now = performance.now();
      ent.lungeT = now;
      state.p.hurtT = now + 150;
      state.hearts = Math.max(0, state.hearts - 1);
      addFloat(state.p.x, state.p.y, '-❤️', '#e0485a');
      let msg = `${ent.beast.name}反擊了！失去 1 顆愛心。`;
      if (state.hearts === 0) {
        const lost = Math.min(3, state.coins);
        state.coins -= lost;
        state.hearts = MAX_HEARTS;
        msg += `<br>🧚 森林仙子幫你恢復了全部體力！${lost ? `（掉了 ${lost} 枚金幣）` : ''}`;
      }
      updateHud();
      bump('heart-pill');
      return msg + '<br>';
    }

    function addCoins(n, ent) {
      state.coins += n;
      updateHud();
      bump('coin-pill');
      addFloat(ent.x, ent.y - .4, `+${n} 🪙`, '#c58a00');
    }

    function showNext(style, text) {
      $('keypad').hidden = true;
      $('next-btn').hidden = false;
      $('next-btn').className = 'btn ' + style;
      $('next-btn').textContent = text;
      $('next-btn').focus({ preventScroll: true });
    }

    function resolveEncounter() {
      const ent = state.active;
      ent.done = true;
      ent.doneT = performance.now() + 400;
      state.locked = true;
      if (ent.type === 'npc') state.npcsDone++;
      else state.beastsDone++;
      if (ent.type === 'beast' && beastsLeft() === 0 && !state.gateOpen) {
        state.gateOpen = true;
        setTimeout(() => toast('🔓 城門打開了！快去城堡！', 3000), 900);
      }
      updateHud();
      $('hint-btn').hidden = true;
      showNext('go', '繼續冒險 ▶');
    }

    function onNext() {
      if (!state || !state.active || $('next-btn').hidden) return;
      sound('tap');
      const ent = state.active;
      if (ent.done) {
        state.active = null;
        state.q = null;
        $('encounter').hidden = true;
        $('controls').hidden = false;
        $('game-screen').classList.remove('encountering');
        try { speechSynthesis.cancel(); } catch (e) {}
      } else {
        state.q = makeQuestion('battle', ent.beast.name);
        presentQuestion();
      }
    }

    // =====================================================================
    // 抵達城堡、結算
    // =====================================================================
    function arriveCastle() {
      state.finished = true;
      heldDirs.length = 0;
      sound('win');
      draw(performance.now(), 0);
      setTimeout(showResult, 500);
    }

    function showResult() {
      if (!state) return;
      const ratio = state.asked ? state.perfect / state.asked : 0;
      let title, stars;
      if (ratio === 1)      { title = `${settings.name}完美完成冒險！`; stars = 3; }
      else if (ratio >= .7) { title = `${settings.name}抵達水晶城堡了！`; stars = 3; }
      else if (ratio >= .4) { title = `${settings.name}平安抵達城堡！`; stars = 2; }
      else                  { title = '抵達城堡了！多冒險幾次會更厲害喔！'; stars = 1; }

      $('result-title').textContent = title;
      $('result-stars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars);
      $('result-detail').innerHTML = `
        <div class="stat"><div class="num">${state.npcsDone} / ${state.npcTotal}</div><div class="lbl">幫助的村民</div></div>
        <div class="stat"><div class="num">${state.beastsDone}</div><div class="lbl">打倒的野獸</div></div>
        <div class="stat"><div class="num">${state.perfect} / ${state.asked}</div><div class="lbl">一次就算對的題目</div></div>
        <div class="stat"><div class="num">🪙 ${state.coins}</div><div class="lbl">收集的金幣</div></div>`;

      const review = $('review');
      review.innerHTML = '';
      $('review-card').hidden = state.wrongs.length === 0;
      state.wrongs.forEach(w => {
        const div = document.createElement('div');
        div.className = 'review-item';
        div.innerHTML = `${w.icon} ${stripTags(w.html)}<br>
          <span class="eq">${w.a} ${opSign(w.op)} ${w.b} = ${w.answer} ${w.unit}</span>　<span class="yours">你寫 ${w.yours}</span>`;
        review.appendChild(div);
      });

      saveBest();
      showScreen('result-screen');
      if (ratio >= .7) confetti();
    }

    const bestKey = () => `knight-map-best-${settings.mode}-${settings.level}-${settings.count}`;
    function saveBest() {
      try {
        const prev = Number(localStorage.getItem(bestKey()) || 0);
        if (state.coins > prev) localStorage.setItem(bestKey(), state.coins);
      } catch (e) {}
    }
    function showBest() {
      let best = 0;
      try { best = Number(localStorage.getItem(bestKey()) || 0); } catch (e) {}
      $('best-text').textContent = best ? `🏅 這種地圖的最多金幣：🪙 ${best} 枚` : '';
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(id).classList.add('active');
      document.body.classList.toggle('playing', id === 'game-screen');
      if (id !== 'game-screen' && document.fullscreenElement) document.exitFullscreen().catch(() => {});
      window.scrollTo(0, 0);
    }

    // 全螢幕按鈕（瀏覽器不支援就藏起來）
    const fsBtn = $('fs-btn');
    if (!document.fullscreenEnabled || !document.documentElement.requestFullscreen) fsBtn.hidden = true;
    fsBtn.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (e) {
        fsBtn.hidden = true;
        toast('這個視窗不能切換全螢幕，畫面已經是最大了');
      }
    });

    function stopGame() {
      if (state) { cancelAnimationFrame(state.raf); state.finished = true; }
      state = null;
      heldDirs.length = 0;
      try { speechSynthesis.cancel(); } catch (e) {}
    }

    // =====================================================================
    // 唸題目、音效、彩帶
    // =====================================================================
    function speak() {
      try {
        if (!state || !state.q || !('speechSynthesis' in window)) return;
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(stripTags(state.q.html));
        u.lang = 'zh-TW';
        u.rate = 0.9;
        speechSynthesis.speak(u);
      } catch (e) {}
    }

    let audioCtx = null;
    function sound(type) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const presets = {
          tap:   { wave: 'sine', notes: [[600, 0.05]] },
          step:  { wave: 'triangle', vol: 0.04, notes: [[170, 0.04]] },
          ding:  { wave: 'sine', notes: [[880, 0.12], [1175, 0.2]] },
          coin:  { wave: 'square', vol: 0.06, notes: [[988, 0.07], [1319, 0.18]] },
          roar:  { wave: 'sawtooth', vol: 0.08, notes: [[140, 0.18], [110, 0.3]] },
          slash: { wave: 'sawtooth', vol: 0.07, notes: [[900, 0.04], [500, 0.08]] },
          good:  { wave: 'sine', notes: [[523, 0.1], [659, 0.1], [784, 0.18]] },
          bad:   { wave: 'triangle', notes: [[220, 0.25]] },
          win:   { wave: 'sine', notes: [[523, 0.12], [659, 0.12], [784, 0.12], [1047, 0.35]] },
        };
        const p = presets[type];
        let t = audioCtx.currentTime;
        p.notes.forEach(([freq, dur]) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = p.wave;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(p.vol || 0.14, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
          t += dur * 0.9;
        });
      } catch (e) {}
    }

    function confetti() {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const colors = ['#e8743b', '#f5b82e', '#2fa85c', '#3d8fd6', '#e0485a'];
      for (let i = 0; i < 60; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = pick(colors);
        c.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        c.style.animationDuration = 2 + Math.random() * 2 + 's';
        c.style.animationDelay = Math.random() * .5 + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4600);
      }
    }

    // =====================================================================
    // 操作：方向鍵按鈕、鍵盤
    // =====================================================================
    const heldDirs = [];
    const holdDir = (d) => { const i = heldDirs.indexOf(d); if (i >= 0) heldDirs.splice(i, 1); heldDirs.push(d); };
    const releaseDir = (d) => { const i = heldDirs.indexOf(d); if (i >= 0) heldDirs.splice(i, 1); };

    document.querySelectorAll('.pad').forEach(b => {
      const d = b.dataset.dir;
      const start = (e) => {
        e.preventDefault();
        if (!state || state.active) return;
        b.classList.add('held');
        try { b.setPointerCapture(e.pointerId); } catch (_) {}
        holdDir(d);
      };
      const end = () => { b.classList.remove('held'); releaseDir(d); };
      b.addEventListener('pointerdown', start);
      b.addEventListener('pointerup', end);
      b.addEventListener('pointercancel', end);
      b.addEventListener('lostpointercapture', end);
      b.addEventListener('contextmenu', (e) => e.preventDefault());
    });

    const KEY_DIRS = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
    document.addEventListener('keydown', (e) => {
      if (!state || !$('game-screen').classList.contains('active') || !$('quit-modal').hidden) return;
      const k = e.key;
      if (!state.active) {
        const d = KEY_DIRS[k];
        if (d) { e.preventDefault(); holdDir(d); }
        return;
      }
      if (/^[0-9]$/.test(k)) press(k);
      else if (k === 'Backspace') { e.preventDefault(); press('del'); }
      else if (k === 'Enter') {
        e.preventDefault();
        if (!$('next-btn').hidden) onNext(); else press('ok');
      }
    });
    document.addEventListener('keyup', (e) => { const d = KEY_DIRS[e.key]; if (d) releaseDir(d); });
    window.addEventListener('blur', () => { heldDirs.length = 0; document.querySelectorAll('.pad').forEach(b => b.classList.remove('held')); });

    $('keypad').addEventListener('click', (e) => {
      const k = e.target.closest('.key');
      if (k) press(k.dataset.key);
    });
    $('hint-btn').addEventListener('click', () => { sound('tap'); showHint(); });
    $('speak-btn').addEventListener('click', speak);
    $('next-btn').addEventListener('click', onNext);
    $('start-btn').addEventListener('click', () => { sound('tap'); startGame(); });
    $('again-btn').addEventListener('click', () => { sound('tap'); startGame(); });
    $('home-btn').addEventListener('click', () => { sound('tap'); stopGame(); showBest(); showScreen('start-screen'); });
    $('quit-btn').addEventListener('click', () => { sound('tap'); heldDirs.length = 0; $('quit-modal').hidden = false; });
    $('quit-no').addEventListener('click', () => { sound('tap'); $('quit-modal').hidden = true; });
    $('quit-yes').addEventListener('click', () => {
      sound('tap'); $('quit-modal').hidden = true; stopGame(); showBest(); showScreen('start-screen');
    });

    showBest();
  </script>
</body>
</html>
